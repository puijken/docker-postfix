services:
  postfix:
    image: ghcr.io/puijken/docker-postfix:latest
    container_name: postfix
    restart: always
    expose:
      - "25"
    env_file:
      - .env   # SMTP_USERNAME / SMTP_PASSWORD belong here, not in the compose file
    environment:
      - SMTP_SERVER=smtp.gmail.com
      - SERVER_HOSTNAME=relay.example.com
      - SMTP_NETWORKS=192.168.10.0/24
      - TZ=Europe/Amsterdam
    volumes:
      # The mail queue. Without a volume, mail still waiting for delivery is lost whenever the
      # container is recreated (an image update, a compose change).
      - spool:/var/spool/postfix

volumes:
  spool:
